services:
  app:
    container_name: telegram_downloader
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - n8n
    restart: unless-stopped

networks:
  n8n:
    external: true